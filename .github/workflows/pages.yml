name: Publish Schnellen website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Set public address and assemble website
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 tools/prepare-site.py "$SITE_URL"
          mkdir -p _site
          cp index.html datenschutz.html 404.html styles.css sitemap.xml robots.txt .nojekyll _site/
          cp -R assets _site/assets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
