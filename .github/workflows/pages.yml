name: Publish Schnellen website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set public address and assemble website
        working-directory: Schnellen-Website
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 tools/prepare-site.py "$SITE_URL"
          mkdir -p _site
          cp index.html datenschutz.html 404.html styles.css sitemap.xml robots.txt _site/
          cp -R assets _site/assets
          touch _site/.nojekyll

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: Schnellen-Website/_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
